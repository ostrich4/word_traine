name: word_trainer
description: "Offline foreign word trainer with spaced repetition, SQLite, MVVM and REST import."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.3
  fl_chart: ^1.2.0
  intl: ^0.18.0
  provider: ^6.0.5
  sqflite_common_ffi_web: ^1.2.0
  sqflite_common_ffi: ^2.4.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
